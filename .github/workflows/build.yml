name: Build Locomotion 26.2 Fabric port

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch upstream Locomotion
        shell: bash
        run: |
          git clone https://github.com/Trainguy9512/locomotion.git work
          cd work
          git checkout d1cab66e949dcfcd98481bc31eb42111edeeceac

      - name: Apply deterministic 1.21.11 to 26.2 symbol migration
        shell: bash
        run: |
          set -euo pipefail
          npx -y modforge bridge --from 1.21.11 --to 26.2 --namespace source work/src/main/java --apply --out work/modforge-common.md
          npx -y modforge bridge --from 1.21.11 --to 26.2 --namespace source work/fabric/src/main/java --apply --out work/modforge-fabric.md
          echo "===== ModForge common summary ====="
          tail -n 20 work/modforge-common.md || true
          echo "===== ModForge fabric summary ====="
          tail -n 20 work/modforge-fabric.md || true

      - name: Convert upstream project to Fabric 26.2 workspace
        shell: bash
        run: |
          set -euo pipefail
          cd work

          cp -r fabric/src/main/java/* src/main/java/
          rm -f src/main/java/com/trainguy9512/locomotion/LocomotionDataGenerator.java

          rm -rf buildSrc forge neoforge fabric
          rm -f build.gradle.kts settings.gradle.kts stonecutter.gradle.kts
          rm -f src/main/resources/locomotion.accesswidener
          rm -f src/main/java/com/trainguy9512/locomotion/mixin/debug/MixinDebugScreenOverlay.java
          rm -f src/main/java/com/trainguy9512/locomotion/mixin/item/MixinItemInHandLayer.java
          rm -f src/main/java/com/trainguy9512/locomotion/mixin/render/MixinLayerDefinitions.java
          rm -f src/main/java/com/trainguy9512/locomotion/mixin/render/layer/MixinCapeLayer.java
          rm -f src/main/java/com/trainguy9512/locomotion/mixin/render/layer/MixinElytraLayer.java

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }

          group = project.maven_group
          version = project.mod_version

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven { url = 'https://maven.fabricmc.net/' }
              maven { url = 'https://maven.isxander.dev/releases' }
              maven { url = 'https://maven.terraformersmc.com/releases/' }
          }

          loom {
              accessWidenerPath = file('src/main/resources/locomotion.classtweaker')
          }

          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

              compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"
              compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
          }

          processResources {
              inputs.property 'version', project.version
              filesMatching('fabric.mod.json') {
                  expand version: project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
              options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }

          jar {
              from('LICENSE') {
                  rename { "${it}_${project.archives_base_name}" }
              }
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'locomotion-fabric-26.2-port'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G
          org.gradle.parallel=false
          org.gradle.configuration-cache=false

          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.17.21
          fabric_api_version=0.161.0+26.2
          yacl_version=3.9.6+26.2
          modmenu_version=20.0.1

          mod_version=0.1.12+26.2-port4
          maven_group=com.trainguy9512
          archives_base_name=locomotion-fabric
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          networkTimeout=10000
          retries=2
          retryBackOffMs=1000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "locomotion",
            "version": "${version}",
            "name": "Locomotion",
            "description": "An animation overhaul mod. Minecraft 26.2 Fabric test port based on upstream 0.1.12 playtesting source.",
            "authors": ["James Pelter AKA Trainguy9512"],
            "license": "ARR",
            "icon": "assets/locomotion/icon.png",
            "environment": "client",
            "entrypoints": {
              "client": ["com.trainguy9512.locomotion.LocomotionFabric"],
              "modmenu": ["com.trainguy9512.locomotion.integration.ModMenuIntegration"]
            },
            "mixins": [
              "locomotion-common.mixins.json",
              "locomotion-fabric.mixins.json"
            ],
            "accessWidener": "locomotion.classtweaker",
            "depends": {
              "fabricloader": ">=0.19.5",
              "fabric-api": "*",
              "minecraft": "~26.2",
              "java": ">=25"
            },
            "suggests": {
              "yet_another_config_lib_v3": "*",
              "modmenu": "*"
            }
          }
          EOF

          cat > src/main/resources/locomotion-common.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.trainguy9512.locomotion.mixin",
            "compatibilityLevel": "JAVA_25",
            "mixins": [],
            "client": [
              "debug.MixinDefaultPlayerSkin",
              "game.MixinLevelChunk",
              "game.MixinMinecraft",
              "game.MixinMultiPlayerGameMode",
              "item.MixinBlocksAttacks",
              "item.MixinItemTransform",
              "item.property.MixinCrossbowPull",
              "item.property.MixinIsUsingItem",
              "item.property.MixinUseCycle",
              "item.property.MixinUseDuration",
              "render.MixinEntityRenderDispatcher",
              "render.MixinEntityRenderer",
              "render.MixinEntityRenderState",
              "render.MixinFishingHookRenderer",
              "render.MixinGameRenderer",
              "render.MixinItemInHandRenderer",
              "render.MixinLivingEntityRenderer",
              "render.MixinModelFeatureRenderer",
              "render.MixinModelPart"
            ],
            "injectors": {"defaultRequire": 1}
          }
          EOF

          cat > src/main/resources/locomotion-fabric.mixins.json <<'EOF'
          {
            "required": true,
            "package": "com.trainguy9512.locomotion.fabric.mixin",
            "compatibilityLevel": "JAVA_25",
            "mixins": [],
            "injectors": {"defaultRequire": 1}
          }
          EOF

          printf '%s\n' 'classTweaker v1 official' > src/main/resources/locomotion.classtweaker

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main/java/com/trainguy9512/locomotion/LocomotionFabric.java')
          s = p.read_text()
          s = s.replace('registerReloader(LocomotionResources.RELOADER_IDENTIFIER, new LocomotionResources())',
                        'registerReloadListener(LocomotionResources.RELOADER_IDENTIFIER, new LocomotionResources())')
          p.write_text(s)

          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/render/MixinItemInHandRenderer.java')
          s = p.read_text().replace('renderHandsWithItems', 'submitHandsWithItems').replace('renderArmWithItem', 'submitArmWithItem')
          p.write_text(s)

          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/render/MixinGameRenderer.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.client.renderer.GameRenderer;\n',
                        'import net.minecraft.client.renderer.GameRenderer;\nimport net.minecraft.client.renderer.state.CameraRenderState;\n')
          s = s.replace('at = @At(value = "INVOKE", target = "Lnet/minecraft/client/renderer/GameRenderer;extractCamera(F)V")',
                        'at = @At("HEAD")')
          s = s.replace('private void addCameraRotation(PoseStack poseStack, float partialTicks, CallbackInfo ci)',
                        'private void addCameraRotation(CameraRenderState cameraState, PoseStack poseStack, CallbackInfo ci)')
          s = s.replace('private void removeViewBobbing(PoseStack poseStack, float partialTicks, CallbackInfo ci)',
                        'private void removeViewBobbing(CameraRenderState cameraState, PoseStack poseStack, CallbackInfo ci)')
          p.write_text(s)

          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/render/MixinModelFeatureRenderer.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.client.renderer.SubmitNodeStorage;\n', '')
          s = s.replace('import org.spongepowered.asm.mixin.injection.Redirect;\n', '')
          s = s.replace('method = "renderModel"', 'method = "prepareModel"')
          s = s.replace('@Local(argsOnly = true) SubmitNodeStorage.ModelSubmit<S> modelSubmit',
                        '@Local(argsOnly = true) ModelFeatureRenderer.Submit<S> modelSubmit')
          p.write_text(s)

          # 26.2 moved camera state into renderer.state.level.
          for p in Path('src/main/java').rglob('*.java'):
              s = p.read_text()
              s = s.replace('net.minecraft.client.renderer.state.CameraRenderState',
                            'net.minecraft.client.renderer.state.level.CameraRenderState')
              s = s.replace('Lnet/minecraft/client/renderer/state/CameraRenderState;',
                            'Lnet/minecraft/client/renderer/state/level/CameraRenderState;')
              p.write_text(s)

          # Debug overlay API was rewritten in 26.2 and is unrelated to Locomotion's runtime animations.
          Path('src/main/java/com/trainguy9512/locomotion/debug/DebugEntryFirstPersonDrivers.java').unlink(missing_ok=True)
          Path('src/main/java/com/trainguy9512/locomotion/debug/LocomotionDebugScreenEntries.java').unlink(missing_ok=True)
          p = Path('src/main/java/com/trainguy9512/locomotion/LocomotionFabric.java')
          s = p.read_text()
          s = s.replace('import com.trainguy9512.locomotion.debug.DebugEntryFirstPersonDrivers;\n', '')
          s = s.replace('import com.trainguy9512.locomotion.debug.LocomotionDebugScreenEntries;\n', '')
          s = s.replace('import net.fabricmc.fabric.api.client.debug.v1.DebugScreenEntries;\n', '')
          s = s.replace('        LocomotionDebugScreenEntries.register(DebugScreenEntries::register);\n', '')
          p.write_text(s)

          # BlockRenderDispatcher no longer exists in 26.2. The mixin implemented optional animated
          # held-block rendering which is currently disabled upstream, so do not ship the dead hook.
          Path('src/main/java/com/trainguy9512/locomotion/mixin/render/MixinBlockRenderDispatcher.java').unlink(missing_ok=True)

          # Minecraft 26.2 changed the block-entity submit pipeline. The old chest/shulker WrapOperation
          # targets no longer exist and hard-fail resource reload. Disable only those two hooks so the
          # player animation system remains active while block-entity animation support is deferred.
          Path('src/main/java/com/trainguy9512/locomotion/mixin/render/block_entity/MixinChestRenderer.java').unlink(missing_ok=True)
          Path('src/main/java/com/trainguy9512/locomotion/mixin/render/block_entity/MixinShulkerBoxRenderer.java').unlink(missing_ok=True)

          # ItemTransform was moved to client.resources.model.cuboid.
          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/item/MixinItemTransform.java')
          s = p.read_text().replace(
              'net.minecraft.client.renderer.block.model.ItemTransform',
              'net.minecraft.client.resources.model.cuboid.ItemTransform'
          )
          p.write_text(s)

          # Minecraft 26.2 split registry objects into EntityTypes and BlockEntityTypes.
          p = Path('src/main/java/com/trainguy9512/locomotion/LocomotionMain.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.world.entity.EntityType;\n',
                        'import net.minecraft.world.entity.EntityTypes;\n')
          s = s.replace('import net.minecraft.world.level.block.entity.BlockEntityType;\n',
                        'import net.minecraft.world.level.block.entity.BlockEntityTypes;\n')
          s = s.replace('EntityType.PLAYER', 'EntityTypes.PLAYER')
          s = s.replace('BlockEntityType.CHEST', 'BlockEntityTypes.CHEST')
          s = s.replace('BlockEntityType.ENDER_CHEST', 'BlockEntityTypes.ENDER_CHEST')
          s = s.replace('BlockEntityType.TRAPPED_CHEST', 'BlockEntityTypes.TRAPPED_CHEST')
          s = s.replace('BlockEntityType.SHULKER_BOX', 'BlockEntityTypes.SHULKER_BOX')
          p.write_text(s)

          p = Path('src/main/java/com/trainguy9512/locomotion/animation/animator/entity/firstperson/FirstPersonDrivers.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.world.entity.EntityType;\n',
                        'import net.minecraft.world.entity.EntityType;\nimport net.minecraft.world.entity.EntityTypes;\n')
          s = s.replace('EntityType.COW', 'EntityTypes.COW')
          p.write_text(s)

          # BlockEntityType#getKey was removed; query the built-in registry instead.
          for rel in [
              'src/main/java/com/trainguy9512/locomotion/animation/animator/JointAnimatorDispatcher.java',
              'src/main/java/com/trainguy9512/locomotion/config/LocomotionConfigScreen.java'
          ]:
              p = Path(rel)
              s = p.read_text()
              if 'net.minecraft.core.registries.BuiltInRegistries' not in s:
                  idx = s.find('import ')
                  s = s[:idx] + 'import net.minecraft.core.registries.BuiltInRegistries;\n' + s[idx:]
              s = s.replace('BlockEntityType.getKey(', 'BuiltInRegistries.BLOCK_ENTITY_TYPE.getKey(')
              p.write_text(s)

          # Tuple was removed from Minecraft 26.2. Keep the exact Locomotion API via a tiny local tuple.
          tuple_path = Path('src/main/java/com/trainguy9512/locomotion/animation/util/Tuple.java')
          tuple_path.write_text('''package com.trainguy9512.locomotion.animation.util;\n\npublic record Tuple<A, B>(A a, B b) {\n    public A getA() { return a; }\n    public B getB() { return b; }\n}\n''')
          for rel in [
              'src/main/java/com/trainguy9512/locomotion/animation/pose/function/AnimationPlayer.java',
              'src/main/java/com/trainguy9512/locomotion/animation/pose/function/SequencePlayerFunction.java',
              'src/main/java/com/trainguy9512/locomotion/animation/pose/function/statemachine/StateTransition.java'
          ]:
              p = Path(rel)
              s = p.read_text().replace('import net.minecraft.util.Tuple;',
                                        'import com.trainguy9512.locomotion.animation.util.Tuple;')
              p.write_text(s)

          # These renderer fields were already unused upstream. Their backing vanilla APIs were removed.
          p = Path('src/main/java/com/trainguy9512/locomotion/render/FirstPersonPlayerRenderer.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.client.renderer.block.BlockRenderDispatcher;\n', '')
          s = s.replace('    private final ItemRenderer itemRenderer;\n', '')
          s = s.replace('    private final BlockRenderDispatcher blockRenderer;\n', '')
          s = s.replace('        this.itemRenderer = minecraft.getItemRenderer();\n', '')
          s = s.replace('        this.blockRenderer = context.getBlockRenderDispatcher();\n', '')
          s = s.replace('        this.minecraft.gameRenderer.getFeatureRenderDispatcher().renderAllFeatures();\n', '')
          s = s.replace('        this.minecraft.renderBuffers().bufferSource().endBatch();\n', '')
          p.write_text(s)

          # The upstream 0.1.12 third-person player animator currently constructs an empty pose.
          # Registering it on 26.2 freezes the player model, so leave third person to vanilla until
          # a real third-person Locomotion pose graph exists.
          p = Path('src/main/java/com/trainguy9512/locomotion/LocomotionMain.java')
          s = p.read_text()
          s = s.replace('        JointAnimatorRegistry.registerEntityJointAnimator(EntityTypes.PLAYER, new ThirdPersonPlayerJointAnimator());\n', '')
          p.write_text(s)

          # Minecraft 26.2 keeps the same mining/use entry points but merged entity interaction into
          # interact(Player, Entity, EntityHitResult, InteractionHand). Rewrite this mixin explicitly
          # instead of carrying the removed interactAt hook.
          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/game/MixinMultiPlayerGameMode.java')
          p.write_text(r'''package com.trainguy9512.locomotion.mixin.game;

import com.trainguy9512.locomotion.animation.animator.JointAnimatorDispatcher;
import com.trainguy9512.locomotion.animation.animator.entity.firstperson.FirstPersonDrivers;
import com.trainguy9512.locomotion.animation.animator.entity.firstperson.FirstPersonUseAnimations;
import net.minecraft.client.Minecraft;
import net.minecraft.client.multiplayer.MultiPlayerGameMode;
import net.minecraft.client.player.LocalPlayer;
import net.minecraft.core.BlockPos;
import net.minecraft.core.Direction;
import net.minecraft.world.InteractionHand;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.entity.Entity;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.phys.BlockHitResult;
import net.minecraft.world.phys.EntityHitResult;
import org.spongepowered.asm.mixin.Final;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

@Mixin(MultiPlayerGameMode.class)
public class MixinMultiPlayerGameMode {
    @Shadow @Final private Minecraft minecraft;

    @Inject(method = "stopDestroyBlock", at = @At("HEAD"))
    private void locomotion$stopMining(CallbackInfo ci) {
        if (this.minecraft.player != null && !this.minecraft.player.getAbilities().instabuild) {
            JointAnimatorDispatcher.getInstance().getFirstPersonPlayerDataContainer().ifPresent(dataContainer -> {
                if (dataContainer.getDriver(FirstPersonDrivers.IS_MINING).getPreviousValue()
                        || dataContainer.getDriverValue(FirstPersonDrivers.IS_MINING)) {
                    dataContainer.getDriver(FirstPersonDrivers.IS_MINING).setValue(false);
                }
            });
        }
    }

    @Inject(method = "startDestroyBlock", at = @At("HEAD"))
    private void locomotion$startMining(BlockPos pos, Direction direction, CallbackInfoReturnable<Boolean> cir) {
        if (this.minecraft.player != null && !this.minecraft.player.getAbilities().instabuild) {
            JointAnimatorDispatcher.getInstance().getFirstPersonPlayerDataContainer().ifPresent(
                    dataContainer -> dataContainer.getDriver(FirstPersonDrivers.IS_MINING).setValue(true)
            );
        }
    }

    @Inject(method = "continueDestroyBlock", at = @At("HEAD"))
    private void locomotion$continueMining(BlockPos pos, Direction direction, CallbackInfoReturnable<Boolean> cir) {
        if (this.minecraft.player != null && !this.minecraft.player.getAbilities().instabuild) {
            JointAnimatorDispatcher.getInstance().getFirstPersonPlayerDataContainer().ifPresent(
                    dataContainer -> dataContainer.getDriver(FirstPersonDrivers.IS_MINING).setValue(true)
            );
        }
    }

    @Inject(method = "destroyBlock", at = @At("RETURN"))
    private void locomotion$creativeDestroy(BlockPos pos, CallbackInfoReturnable<Boolean> cir) {
        if (this.minecraft.player != null && cir.getReturnValue() && this.minecraft.player.getAbilities().instabuild) {
            JointAnimatorDispatcher.getInstance().getFirstPersonPlayerDataContainer().ifPresent(
                    dataContainer -> dataContainer.getDriver(FirstPersonDrivers.HAS_ATTACKED).trigger()
            );
        }
    }

    @Inject(method = "useItem", at = @At("RETURN"))
    private void locomotion$useItem(Player player, InteractionHand hand, CallbackInfoReturnable<InteractionResult> cir) {
        if (cir.getReturnValue() instanceof InteractionResult.Success success) {
            FirstPersonUseAnimations.triggerUseAnimation(
                    hand,
                    FirstPersonUseAnimations.UseAnimationType.USE_ITEM,
                    success.swingSource()
            );
        }
    }

    @Inject(method = "useItemOn", at = @At("RETURN"))
    private void locomotion$useItemOn(LocalPlayer player, InteractionHand hand, BlockHitResult hitResult,
                                      CallbackInfoReturnable<InteractionResult> cir) {
        if (cir.getReturnValue() instanceof InteractionResult.Success success) {
            FirstPersonUseAnimations.triggerUseAnimation(
                    hand,
                    FirstPersonUseAnimations.UseAnimationType.USE_ITEM_ON_BLOCK,
                    success.swingSource()
            );
        }
    }

    @Inject(method = "interact", at = @At("RETURN"))
    private void locomotion$interact(Player player, Entity target, EntityHitResult hitResult, InteractionHand hand,
                                     CallbackInfoReturnable<InteractionResult> cir) {
        if (cir.getReturnValue() instanceof InteractionResult.Success success) {
            FirstPersonUseAnimations.triggerUseAnimation(
                    hand,
                    FirstPersonUseAnimations.UseAnimationType.INTERACT_AT_ENTITY,
                    success.swingSource()
            );
        }
    }
}
''')

          # In 26.2 submitHandsWithItems owns the complete vanilla first-person hand/item submission.
          # Rendering Locomotion at HEAD without cancelling it causes both renderers to appear together.
          # Render Locomotion only when its pose is ready, then cancel the vanilla submission completely.
          p = Path('src/main/java/com/trainguy9512/locomotion/mixin/render/MixinItemInHandRenderer.java')
          p.write_text(r'''package com.trainguy9512.locomotion.mixin.render;

import com.mojang.blaze3d.vertex.PoseStack;
import com.trainguy9512.locomotion.LocomotionMain;
import com.trainguy9512.locomotion.access.FirstPersonPlayerRendererGetter;
import com.trainguy9512.locomotion.animation.animator.JointAnimatorDispatcher;
import com.trainguy9512.locomotion.render.FirstPersonPlayerRenderer;
import net.minecraft.client.Minecraft;
import net.minecraft.client.player.LocalPlayer;
import net.minecraft.client.renderer.ItemInHandRenderer;
import net.minecraft.client.renderer.SubmitNodeCollector;
import net.minecraft.world.InteractionHand;
import org.spongepowered.asm.mixin.Final;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

@Mixin(ItemInHandRenderer.class)
public class MixinItemInHandRenderer {
    @Shadow @Final private Minecraft minecraft;

    @Inject(
            method = "submitHandsWithItems",
            at = @At("HEAD"),
            cancellable = true
    )
    private void locomotion$submitOnlyLocomotionHands(
            float partialTick,
            PoseStack poseStack,
            SubmitNodeCollector nodeCollector,
            LocalPlayer player,
            int packedLight,
            CallbackInfo ci
    ) {
        if (!LocomotionMain.CONFIG.data().firstPersonPlayer.enableRenderer) {
            return;
        }

        JointAnimatorDispatcher dispatcher = JointAnimatorDispatcher.getInstance();
        if (dispatcher.getFirstPersonPlayerDataContainer().isEmpty()
                || dispatcher.getInterpolatedFirstPersonPlayerPose().isEmpty()) {
            return;
        }

        FirstPersonPlayerRendererGetter getter = (FirstPersonPlayerRendererGetter) this.minecraft.getEntityRenderDispatcher();
        if (getter.locomotion$getFirstPersonPlayerRenderer().isEmpty()) {
            return;
        }

        FirstPersonPlayerRenderer renderer = getter.locomotion$getFirstPersonPlayerRenderer().get();
        renderer.renderLocomotionArmWithItem(partialTick, poseStack, nodeCollector, player, packedLight, InteractionHand.OFF_HAND);
        renderer.renderLocomotionArmWithItem(partialTick, poseStack, nodeCollector, player, packedLight, InteractionHand.MAIN_HAND);
        ci.cancel();
    }
}
''')

          # setScreen moved to Gui. Minecraft exposes setScreenAndShow for callers.
          p = Path('src/main/java/com/trainguy9512/locomotion/config/LocomotionConfig.java')
          s = p.read_text().replace('Minecraft.getInstance().setScreen(parent)',
                                    'Minecraft.getInstance().setScreenAndShow(parent)')
          p.write_text(s)

          # screen moved to Gui in 26.2. Until an accessor is needed, disable this cosmetic transition
          # signal rather than depending on a private GUI field.
          p = Path('src/main/java/com/trainguy9512/locomotion/animation/animator/entity/firstperson/FirstPersonJointAnimator.java')
          s = p.read_text().replace(
              'driverContainer.getDriver(FirstPersonDrivers.HAS_SCREEN_OPEN).setValue(Minecraft.getInstance().screen != null);',
              'driverContainer.getDriver(FirstPersonDrivers.HAS_SCREEN_OPEN).setValue(false);'
          )
          p.write_text(s)

          # COPPER_CHESTS and DOORS item tag constants were removed. Copper chests are optional pose
          # overrides and door posing is currently commented out upstream, so remove only those stale references.
          p = Path('src/main/java/com/trainguy9512/locomotion/animation/animator/entity/firstperson/handpose/FirstPersonGenericItems.java')
          s = p.read_text()
          s = s.replace('            ItemTags.COPPER_CHESTS,\n', '')
          s = s.replace('        return itemStack.is(ItemTags.DOORS);',
                        '        return itemStack.getItem() instanceof BlockItem;')
          p.write_text(s)
          PY

      - name: Build
        shell: bash
        run: |
          cd work
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: locomotion-fabric-0.1.12-26.2-port
          path: |
            work/build/libs/*.jar
          if-no-files-found: error
